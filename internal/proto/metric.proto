syntax = "proto3";

package metric;

option go_package = "proto/metric";

message UpdateMetricsRequest{
    repeated Metric metrics = 1;
}

message UpdateMetricsResponse{
  
}

message Metric{
    string id = 1;
    string type = 2;
    sint64 delta = 3;
    float value = 4;
}


service MetricService {
  rpc Update(UpdateMetricsRequest) returns (UpdateMetricsResponse);
}